# The build prerenders the WordPress content into dist/index.html, so content
# edits in WordPress only reach crawlers after a rebuild. Create a Build hook
# (Site configuration > Build & deploy > Build hooks) and call it from
# WordPress on publish/update (e.g. the "WP Webhooks" or "Deploy with Netlify"
# plugin).
#
# Required environment variables (Site configuration > Environment variables):
#   VITE_WP_DOMAIN  e.g. https://api.boissonsolutionx.ca
#   VITE_SITE_URL   e.g. https://boissonsolutionx.ca (canonical, sitemap, OG)

[build]
  command = "npm run build"
  publish = "dist"

# Hashed bundles never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Root images keep their names across deploys: cache a week, then revalidate
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
